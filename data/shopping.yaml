# Shopping list — items to acquire for the garden.
#
# The generated docs/shopping.md renders this as a clickable task list
# on GitHub. When items are bought, either:
#   (a) check the box on GitHub (commits a change to shopping.md), or
#   (b) tell the assistant in chat.
# The assistant reconciles: moves items from `open` to `purchased`,
# sets purchased_on, and regenerates the markdown so the two stay
# in sync.

open:
  - id: ph-test-kit
    item: Soil pH test kit or digital pH meter
    priority: must-have
    est_cost: $10-20
    why: >-
      Essential. Every soil-recipe decision depends on an accurate
      pH reading. Our premixed base reportedly reads ~7.0, which
      affects every crop.
    notes: null

  - id: elemental-sulfur
    item: Granular elemental sulfur (Espoma Soil Acidifier or Down to Earth Soil Acidifier)
    priority: must-have
    est_cost: ~$10
    why: >-
      Primary tool for lowering soil pH. Slow-acting (works over
      weeks). Critical for potatoes (need pH 5.0-6.0 to avoid scab)
      and helpful for strawberries.
    notes: null

  - id: gypsum
    item: Pelletized gypsum (calcium sulfate)
    priority: must-have
    est_cost: ~$8
    why: >-
      Calcium source that does NOT raise pH. Replaces limestone-
      based Mag-I-Cal Plus in the Tomato & Pepper Mix.
    notes: >-
      Check the Mag-I-Cal bag — standard "Mag-I-Cal" is already
      gypsum-based (pH-neutral, OK to keep using). "Mag-I-Cal Plus"
      is calcitic limestone (raises pH — swap for gypsum).

  - id: epsom-salts
    item: Epsom salts (magnesium sulfate)
    priority: must-have
    est_cost: ~$5
    why: >-
      Magnesium without a pH bump. Pairs with gypsum to replace
      the Ca/Mg that Mag-I-Cal Plus was supplying.
    notes: null

  - id: pine-bark-fines
    item: Pine bark fines or pine needles (bagged)
    priority: nice-to-have
    est_cost: ~$10/bag
    why: >-
      Slightly acidic mulch topdress for potatoes and strawberries
      (both prefer soil below 6.0). Also adds slow organic matter.
    notes: null

purchased: []
