# Shopping list — items to acquire for the garden.
#
# The generated docs/shopping.md renders this as a clickable task list
# on GitHub. When items are bought, either:
#   (a) check the box on GitHub (commits a change to shopping.md), or
#   (b) tell the assistant in chat.
# The assistant reconciles: moves items from `open` to `purchased`,
# sets purchased_on, and regenerates the markdown so the two stay
# in sync.

open:
  - id: ph-test-kit
    item: Soil pH test kit or digital pH meter
    priority: must-have
    est_cost: $10-20
    why: >-
      Essential. Every soil-recipe decision depends on an accurate
      pH reading. Our premixed base reportedly reads ~7.0, which
      affects every crop.
    notes: null

  - id: pine-bark-fines
    item: Pine bark fines or pine needles (bagged)
    priority: nice-to-have
    est_cost: ~$10/bag
    why: >-
      Slightly acidic mulch topdress for potatoes and strawberries
      (both prefer soil below 6.0). Also adds slow organic matter.
    notes: null

purchased:
  - id: gypsum
    item: Earth Science Fast Acting Gypsum
    purchased_on: 2026-04-17
    supply_id: gypsum
    notes: >-
      2.5 lb bag, ~$11.99. 90% calcium sulfate dihydrate, 20% Ca,
      16% sulfate sulfur, 1% polyacrylamide polymer. Replaces
      Mag-I-Cal in the Tomato & Pepper Mix.

  - id: elemental-sulfur
    item: Earth Science Fast Acting Sulfur
    purchased_on: 2026-04-17
    supply_id: elemental-sulfur
    notes: >-
      2.5 lb bag. 26% free elemental S, 10% combined sulfate S,
      12% Ca (from bundled gypsum). Net effect acidifying.
      For Potato Mix and Strawberry Mix.

  - id: epsom-salt
    item: Dr Teal's Epsom Salt
    purchased_on: 2026-04-17
    supply_id: epsom-salt
    notes: >-
      Pure MgSO4-7H2O. Magnesium without a pH bump. Pairs with
      gypsum to replace what Mag-I-Cal Plus was supplying.
