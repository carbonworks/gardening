# Inventory of growing supplies: substrates, amendments, composts, hardware.
# `id` values are referenced by mixes.yaml and future soil recipes.

supplies:
  # --- Substrates (bulk soil-like components) ---
  - id: coco-coir
    name: Coco coir (brick form)
    category: substrate
    notes: Compressed brick; hydrate before use.

  - id: peat-moss
    name: Peat moss
    category: substrate
    notes: null

  - id: expanded-clay-pebbles
    name: Expanded clay pebbles (LECA)
    category: substrate
    used_for: reservoir / drainage layer at bottom of containers
    in_use:
      - container-01
      - container-02

  # --- Amendments ---
  - id: vermiculite
    name: Vermiculite
    category: amendment
    used_for: moisture retention, aeration

  - id: perlite
    name: Perlite
    category: amendment
    used_for: drainage, aeration

  - id: garden-lime
    name: Garden lime
    category: amendment
    used_for: pH adjustment (raise pH), calcium

  - id: mag-i-cal
    name: Mag-I-Cal
    category: amendment
    used_for: calcium + magnesium, pH adjustment
    notes: Espoma pelletized limestone fortified with magnesium.

  # --- Composts ---
  - id: wild-mushroom-blend
    name: Wild mushroom blend compost
    category: compost
    notes: null

  # --- Containers / hardware ---
  - id: container-5gal
    name: 5 gallon container
    category: container
    size: 5 gal
    material: plastic
    quantity_total: 12
    quantity_in_use: 2
    quantity_available: 10
    notes: >-
      All drainage/reservoir parts are on hand for every 5 gal pot.
      Drainage and clay-pebble reservoirs are installed manually per pot
      as each is brought into service.
