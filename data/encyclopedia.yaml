# Encyclopedia entries for each plant we grow or plan to grow.
# Intended to be reference material, not deep reading. Rendered to
# docs/encyclopedia.md. `plant` matches an id in plants.yaml.
#
# Field conventions:
#   scientific_name / family / origin  — short botanical facts
#   growth_habit / days_to_maturity    — for food crops
#   garden_value                       — what this plant contributes
#   care_highlights                    — key care notes for our setup
#   pest_disease                       — things to watch for
#   companion_role                     — for companions/non-edibles
#   tidbit                             — something fun/interesting

encyclopedia:
  - plant: tomato-dora-red
    scientific_name: Solanum lycopersicum
    family: Solanaceae (nightshade family)
    origin: >-
      Domesticated from wild species in western South America
      (the Andes of Peru and Ecuador) and further developed in
      Mesoamerica. Reached Europe in the 16th century and was long
      thought poisonous because of its nightshade relatives.
    growth_habit: Determinate bush (compact, self-limiting height)
    days_to_maturity: ~65-70 days from transplant (typical for small determinates)
    garden_value: >-
      Determinate tomatoes ripen most of their fruit in a
      concentrated window, which is convenient for small spaces
      and for preserving.
    care_highlights:
      - Consistent moisture; irregular watering causes splitting and blossom end rot.
      - Cage or short stake (they self-limit but still benefit from support).
      - Mulch to stabilize soil moisture and suppress soil splash (reduces disease).
      - Avoid overhead watering; wet leaves invite fungal disease.
    pest_disease:
      - Tomato hornworm (large green caterpillar; handpick)
      - Aphids (sprayed off or managed with beneficials)
      - Early blight and septoria leaf spot (mulch + airflow help)
      - Blossom end rot (calcium deficiency, often from inconsistent water rather than lack of calcium)
    tidbit: >-
      "Dora Red" is not a widely documented cultivar — treat it as a
      generic small determinate bush tomato. If it performs notably,
      log observations in the journal so we can characterize it
      ourselves.

  - plant: tomato-joy-red
    scientific_name: Solanum lycopersicum
    family: Solanaceae (nightshade family)
    origin: See Dora Red — same species, same Andean / Mesoamerican ancestry.
    growth_habit: Determinate bush
    days_to_maturity: ~65-70 days from transplant (typical)
    garden_value: Same profile as Dora Red; planted together for a paired determinate harvest.
    care_highlights:
      - Same as Dora Red.
    pest_disease:
      - Same as Dora Red.
    tidbit: >-
      Also a lightly documented cultivar. "Joy" is more commonly
      encountered as a cherry-tomato line; confirm the specific
      cultivar from the seed/start source when convenient.

  - plant: tomato-hartmans-yellow-gooseberry
    scientific_name: Solanum lycopersicum (var. cerasiforme - cherry type)
    family: Solanaceae
    origin: >-
      An heirloom cherry/currant-type tomato preserved by seed-saving
      communities. The "gooseberry" in the name refers to the
      gooseberry-sized fruit, not the gooseberry plant.
    growth_habit: Indeterminate vine (keeps growing and fruiting until frost)
    days_to_maturity: ~70-75 days from transplant
    garden_value: >-
      Small, sweet, pale yellow fruits produced in big clusters over
      a long season. Indeterminate vines reward strong support and
      regular pruning.
    care_highlights:
      - Stake heavily or use a tall cage — indeterminates can reach 6-8 ft.
      - Prune "suckers" (side shoots in the crotch between stem and branch) for airflow and fruit quality.
      - On a windy 4th-floor deck, tying regularly to a sturdy stake is important.
      - Consistent moisture, mulch, avoid overhead water (same as determinates).
    pest_disease:
      - Same pest/disease list as determinate tomatoes.
      - More susceptible to late-season foliage disease because the plant lives longer.
    tidbit: >-
      Heirloom cherries like this are often sweeter and more intensely
      flavored than grocery tomatoes because they concentrate sugars
      in a smaller fruit. Yellow tomatoes are typically lower in acid
      than reds.

  - plant: pepper-orange-blaze
    scientific_name: Capsicum annuum
    family: Solanaceae (same family as tomatoes)
    origin: >-
      Peppers were domesticated in Mexico and Central America roughly
      6,000 years ago. C. annuum is the species that includes bell
      peppers, jalapeños, and most common garden peppers.
    growth_habit: Compact bush, ~18-24 in tall
    days_to_maturity: ~65 days green, ~85 days fully ripe orange
    garden_value: >-
      Burpee-introduced sweet pepper with 4 inch, elongated orange
      fruits and a sweet, mild flavor. Early-maturing compared with
      full-size bells, which is useful in a 6-hour sun window.
    care_highlights:
      - Loves heat; do not rush outdoors — wait until consistent overnight lows above 55 F.
      - Calcium (via the Mag-I-Cal in the Tomato & Pepper Mix) helps prevent blossom end rot.
      - Mulch to stabilize moisture; inconsistent water causes fruit drop.
      - Pinch the first few flowers on small transplants to encourage root establishment before fruiting.
    pest_disease:
      - Aphids, thrips, pepper hornworm
      - Blossom end rot (same mechanism as tomatoes)
      - Bacterial leaf spot in humid weather
    tidbit: >-
      All bell-type peppers start green and change color as they
      ripen — the red, yellow, orange, and purple peppers in the
      store are just the same pepper at different ripeness stages.
      Fully ripe peppers are sweeter and higher in vitamin C.

  - plant: pepper-lunch-box-orange
    scientific_name: Capsicum annuum
    family: Solanaceae
    origin: Same species history as Orange Blaze.
    growth_habit: Compact bush, prolific
    days_to_maturity: ~75 days to orange
    garden_value: >-
      Mini sweet pepper, 2-3 inches long, snack-sized. Bred for
      container growing and heavy production. The "Lunch Box" series
      comes in red, yellow, and orange colors.
    care_highlights:
      - Same as Orange Blaze.
      - Mini peppers often yield 30+ fruits per plant in a good season; keep up with feeding.
    pest_disease:
      - Same as Orange Blaze.
    tidbit: >-
      Mini sweet peppers got their start as a deliberate breeding
      effort in the early 2000s to create a snack-food category —
      the "grape tomato" of the pepper world.

  - plant: potato-russet
    scientific_name: Solanum tuberosum
    family: Solanaceae (same family as tomatoes and peppers — hence the don't-share-pots rule)
    origin: >-
      Domesticated in the Andes (Peru/Bolivia) 7,000-10,000 years
      ago. Brought to Europe by the Spanish in the late 1500s and
      became a global staple. The Irish Potato Famine (1845-1852)
      was caused by Phytophthora infestans — the same late-blight
      pathogen that affects tomatoes.
    growth_habit: Bushy above ground; edible tubers develop underground along the stem
    days_to_maturity: ~90-120 days depending on variety
    garden_value: >-
      "Russet" is a group of varieties with rough brown skin and
      dry, starchy white flesh — good for baking and frying.
      Russet Burbank is the most famous (the commercial fry potato).
    care_highlights:
      - Plant "chitted" (pre-sprouted) seed potatoes eyes-up.
      - Hill soil up around the stems as plants grow — tubers form along the buried stem, so more buried stem = more potatoes.
      - Slightly acidic soil (pH 5.0-6.0); DO NOT add lime or Mag-I-Cal.
      - Harvest when the tops yellow and die back. Cure in a dark, airy place for a week before storing.
    pest_disease:
      - Colorado potato beetle (striped yellow beetle; handpick)
      - Late blight (Phytophthora infestans) — do not plant near tomatoes
      - Potato scab — worse at high pH (another reason to avoid lime)
    tidbit: >-
      The "eyes" on a potato are dormant buds. A seed potato is just
      a potato grown specifically to be planted rather than eaten.
      Green potatoes (exposed to light) contain solanine and should
      not be eaten — hilling keeps tubers covered and prevents this.

  - plant: basil
    scientific_name: Ocimum basilicum
    family: Lamiaceae (mint family)
    origin: >-
      Tropical Asia and Africa, with India as a likely center of
      domestication — basil has been grown there for over 5,000 years
      as a culinary, medicinal, and religious herb.
    garden_value: >-
      Culinary herb with a long association with tomatoes, both in
      the kitchen and in the garden. Loves heat, thrives alongside
      tomatoes and peppers, and is said to repel thrips, aphids,
      and tomato hornworm moths.
    care_highlights:
      - Pinch flower buds as they appear — flowering shifts the plant into seed production and leaves turn bitter.
      - Harvest above a leaf node to encourage branching.
      - Loves heat; don't plant out until nights are consistently above 50 F.
      - Very susceptible to cold; one light frost will kill it.
    pest_disease:
      - Japanese beetles (skeletonize leaves)
      - Fusarium wilt (systemic, soil-borne — rotate away from basil-infected soil)
      - Downy mildew (major threat in humid Mid-Atlantic summers; look for yellowing between veins and gray fuzz on leaf undersides)
    tidbit: >-
      The name "basil" comes from the Greek "basileus" meaning
      king — it's literally the "royal herb." In Italian folklore,
      a pot of basil on a windowsill was traditionally a sign of
      welcome to suitors.

  - plant: lemon-balm
    scientific_name: Melissa officinalis
    family: Lamiaceae (mint family)
    origin: >-
      Southern Europe, the Mediterranean basin, and western Asia.
      Grown in Europe for well over 2,000 years as a bee plant and
      as a calming herbal tea.
    garden_value: >-
      Lemon-scented leaves for tea and cooking; strongly attractive
      to honeybees and other pollinators. The Melissa genus name is
      Greek for "honeybee."
    care_highlights:
      - Give it its own pot — mint-family rhizomes spread aggressively and will crowd neighbors.
      - Cut back hard mid-season if it gets leggy; it regrows fresh leaves.
      - Tolerates partial sun (a perk for our deck).
      - Flowers are not showy; cut flower stalks to keep leaf production up.
    pest_disease:
      - Generally pest-free (the essential oils that make it fragrant also deter most insects).
      - Powdery mildew in very humid, crowded conditions — improve airflow.
    tidbit: >-
      Ancient Greeks planted lemon balm near beehives to help
      colonies return home. Medieval Carmelite nuns used it in
      "Carmelite Water," a distilled herbal tonic still produced
      today. Rub a leaf in your hands before gardening — the lemon
      scent genuinely lifts the mood.

  - plant: lavender-provence
    scientific_name: Lavandula x intermedia 'Provence' (a lavandin — hybrid of English and spike lavender)
    family: Lamiaceae (mint family)
    origin: >-
      True lavender (L. angustifolia) is native to the Mediterranean
      basin. The Provence cultivar was bred from the L. angustifolia x
      L. latifolia hybrid called "lavandin," selected in the Provence
      region of France for vigor and essential oil yield.
    garden_value: >-
      Pollinator magnet (bees, butterflies, hoverflies), long-blooming
      in mid-summer, powerfully fragrant, and generally left alone by
      deer and rabbits. The dried flower spikes keep their scent for
      months.
      Also credited with repelling mosquitoes, moths (think sachets),
      fleas, and some aphids — the evidence is stronger for moths
      and pantry pests than for mosquitoes.
    care_highlights:
      - Lean, well-drained, slightly alkaline soil — the Mediterranean Herb Mix (base + 30% perlite + 10% vermiculite + lime).
      - Full sun is essential; lavender languishes with less than 6 hours.
      - Water deeply but infrequently; soggy roots are the #1 killer.
      - Prune by a third after flowering to keep the plant shapely and prevent woody centers.
    pest_disease:
      - Root rot from overwatering or poor drainage (most common lavender killer).
      - Spittlebugs — cosmetic only; hose off.
      - Occasional four-lined plant bug damage (leaf spotting).
    companion_role: >-
      Best grown near — but not in — the strawberry and pepper pots.
      Attracts pollinators that benefit fruiting crops, and its
      scent is said to mask the volatiles aphids use to find host
      plants.
    tidbit: >-
      "Lavandin" cultivars like Provence produce far more essential
      oil than true English lavender, which is why they dominate
      commercial lavender farms in southern France. The name
      "lavender" comes from the Latin "lavare" (to wash) — Romans
      scented their baths with it.

  - plant: citronella
    scientific_name: Pelargonium 'Citrosum' (commonly; sometimes labeled Pelargonium citrosum Van Leenii — a cultivar, not a true species)
    family: Geraniaceae
    origin: >-
      The genus Pelargonium is native to southern Africa (most
      scented geraniums originate there). The 'Citrosum' cultivar
      was developed in the Netherlands in the 1980s and marketed
      as the "mosquito plant."
      True citronella oil in candles and torches comes from a
      different plant: citronella grass (Cymbopogon nardus and
      C. winterianus), a tropical grass from South and Southeast
      Asia. Most "citronella plants" sold at garden centers are
      the Pelargonium, not the grass.
    garden_value: >-
      Fragrant lemon-scented foliage; a pleasant patio plant to
      brush against. Small pink flowers are a bonus. Drought-
      tolerant once established.
    care_highlights:
      - Full sun, well-drained soil; uses the General Herb Mix.
      - Pinch growing tips regularly to encourage a bushier plant (you want maximum leaf mass for scent).
      - Feed lightly but consistently — Pelargoniums are not heavy feeders.
      - Zone 7b is marginal; overwinter indoors on a bright windowsill or treat as an annual.
    pest_disease:
      - Whiteflies and aphids indoors.
      - Generally pest-free outdoors.
      - Bacterial leaf spot if foliage stays wet.
    companion_role: >-
      Honest picture of the "mosquito plant" claim: the plant alone
      does not emit enough oil to meaningfully repel mosquitoes from
      the surrounding air. Studies consistently find its passive
      repellency is minimal. Crushing a leaf and rubbing the oil on
      skin has a modest, short-term effect. The name is marketing.
    tidbit: >-
      Because 'Citrosum' is a cultivar, it does not come true from
      seed — the commercial plants are propagated from cuttings.
      That's also why it has no formal species name; it's an
      aromatic hybrid maintained by vegetative propagation.

  - plant: marigold
    scientific_name: Tagetes erecta (African / American marigold series; the "Antigua" series is a compact T. erecta)
    family: Asteraceae (daisy/sunflower family)
    origin: >-
      Native to Mexico and Central America — despite the common
      names "African" and "French," all Tagetes marigolds are from
      the Americas. Aztecs cultivated them for medicine, dye, and
      ceremony; they are the traditional flower of Dia de los
      Muertos (cempasuchil).
    garden_value: >-
      Bright, long-blooming flowers that attract pollinators and
      beneficial insects (hoverflies, lacewings, ladybugs).
      Extremely heat-tolerant. Easy from seed or starts.
    care_highlights:
      - Full sun, deadhead spent blooms to extend flowering.
      - Not picky about soil; happy in the Tomato & Pepper Mix alongside the anchor plant.
      - Pinch back young plants once to encourage branching.
    pest_disease:
      - Spider mites in very hot, dry conditions.
      - Minimal disease; occasional powdery mildew.
    companion_role: >-
      Two overlapping pest-control effects:
      1. Root exudates — specifically from Tagetes patula (French)
         and T. minuta — suppress root-knot nematodes. T. erecta
         (the Antigua series) has a weaker effect but is still
         considered helpful.
      2. Above-ground, the scent is credited with deterring
         whiteflies, some aphids, and cabbage moths, and the
         flowers attract predatory insects that eat pests.
      Marigolds are one of the most consistently supported
      companion plants in the research literature.
    tidbit: >-
      Before synthetic yellow dyes, Aztecs used marigold petals to
      dye fabric. In the poultry industry, marigold extract is
      fed to hens to intensify egg-yolk color — naturally that
      bright orange comes from the same pigments (lutein and
      zeaxanthin) in the petals.

  - plant: nasturtium
    scientific_name: Tropaeolum majus
    family: Tropaeolaceae
    origin: >-
      Native to the Andes (Peru, Bolivia, and Colombia). Brought
      to Europe in the 16th century alongside tomatoes and peppers.
    garden_value: >-
      Edible flowers, leaves, and seeds — all with a peppery,
      watercress-like bite. Easy from seed, vining or mounding
      habits depending on variety, and excellent as a companion
      and trap crop.
    care_highlights:
      - Direct-sow seeds — they resent transplanting.
      - Prefers lean soil; too much fertility gives more leaves and fewer flowers.
      - Full to partial sun.
      - Trailing varieties spill attractively over container edges.
    pest_disease:
      - Aphids — but that's actually the point; nasturtiums are a trap crop.
      - Caterpillars (cabbage white butterflies love them).
      - Generally healthy otherwise.
    companion_role: >-
      Classic "trap crop" for aphids — aphids preferentially
      colonize nasturtium, pulling them off your tomatoes and
      peppers. Also deters squash bugs and whiteflies, and attracts
      hoverflies and predatory wasps that eat other pests.
    tidbit: >-
      The name "nasturtium" is Latin for "nose-twister," referring
      to the peppery flavor. The unripe green seed pods can be
      pickled in brine and vinegar as "poor man's capers" — a
      genuinely good substitute. Biochemically the heat comes from
      mustard-oil glucosinolates, the same compounds in horseradish
      and wasabi.

  - plant: lettuce-mesclun-mix
    scientific_name: (Typically) Lactuca sativa blended with greens from Brassicaceae (arugula, mustards, mizuna) and others
    family: Mostly Asteraceae with Brassicaceae mixed in
    origin: >-
      The word "mesclun" is Provencal French for "mixture,"
      traditionally a baby-green blend harvested around Nice.
      Individual species in a mesclun blend come from across
      Eurasia (lettuce from the Mediterranean, arugula from
      southern Europe, mizuna from Japan, etc.).
    garden_value: >-
      Fast, productive, and cut-and-come-again. Ideal in a partial-
      sun spot and great as an undercrop beneath slower, taller
      plants while weather is cool.
    growth_habit: Low rosette; cut-and-come-again harvest
    days_to_maturity: ~25-30 days for baby leaves; 40-50 for full heads
    care_highlights:
      - Cool weather crop — bolts (goes to seed) in hot sun. In Mid-Atlantic, spring (March-May) and fall (September-October) are the sweet spots.
      - Keep soil consistently moist — lettuce gets bitter when stressed.
      - Harvest outer leaves or cut the whole rosette 1 inch above the crown for regrowth.
      - Succession-sow every 2-3 weeks for continuous harvest.
    pest_disease:
      - Slugs and snails (less of a concern on a 4th-floor deck).
      - Aphids on young growth.
      - Downy mildew in wet weather.
    tidbit: >-
      "Mesclun" and the English word "miscellaneous" share the
      same Latin root — miscere, "to mix." The traditional Nicoise
      blend included chervil, arugula, lettuce, and endive in a
      specific ratio; modern mixes vary widely.

  - plant: strawberry-ever-sweet
    scientific_name: Fragaria x ananassa 'Ever Sweet'
    family: Rosaceae (rose family)
    origin: >-
      The modern garden strawberry is a hybrid that arose in
      18th-century France from two New World species: F. virginiana
      (eastern North America) and F. chiloensis (western South
      America). 'Ever Sweet' is a day-neutral cultivar bred for
      summer heat tolerance and continuous fruiting.
    garden_value: >-
      Day-neutral strawberries fruit continuously through the
      growing season rather than in one big June flush, which suits
      small container gardens where you want a steady supply of a
      few berries at a time.
    care_highlights:
      - Slightly acidic soil (pH 5.5-6.5). Our base mix is slightly alkaline from mushroom compost — an annual topdress of peat or pine fines helps.
      - Consistent moisture; uneven watering gives small, malformed berries.
      - Pinch the first flush of flowers on new plants so energy goes into root establishment.
      - Mulch with straw or pine needles to keep berries off the soil (the name "strawberry" likely comes from this practice).
    pest_disease:
      - Slugs, birds (netting helps), spider mites in heat.
      - Gray mold (Botrytis) on fruit in wet weather.
      - Crown rot from overwatering.
    tidbit: >-
      Strawberries are not true berries botanically — they are
      "accessory fruits," where the fleshy red part is swollen
      receptacle tissue. The real fruits are the tiny seed-like
      structures (achenes) on the outside. A typical strawberry
      has ~200 actual fruits stuck to a single swollen stem tip.

  - plant: strawberry-unknown-basket
    scientific_name: Fragaria x ananassa (cultivar unknown)
    family: Rosaceae
    origin: Same species history as Ever Sweet.
    garden_value: >-
      Pre-planted organic basket bought without a variety label.
      Observing its behavior this season will tell us what we have:
      producing one big flush of fruit in June suggests a June-
      bearing type; steady fruiting through the summer suggests a
      day-neutral or everbearing type; lots of runners suggests a
      June-bearing type.
    care_highlights: Same as Ever Sweet.
    pest_disease: Same as Ever Sweet.
    tidbit: >-
      If you see offshoots on long stems ("runners"), those can be
      pinned into small pots of soil and will root into new plants —
      free propagation. June-bearing strawberries are especially
      prolific runner producers.

  - plant: cucumber  # wishlist entry; no plants.yaml id yet
    scientific_name: Cucumis sativus
    family: Cucurbitaceae (cucurbit / gourd family)
    origin: >-
      Native to India and cultivated there for at least 3,000 years.
      Spread to China and the Mediterranean in antiquity; Romans
      grew cucumbers year-round under translucent stone or oiled
      cloth — a very early form of greenhouse.
    growth_habit: >-
      Vining (needs trellising) or bush types. Vining usually
      gives higher yield per square foot in containers if trellised
      vertically.
    days_to_maturity: ~50-65 days from transplant
    garden_value: >-
      Prolific, fast, rewarding. A well-tended cucumber vine can
      produce a cuke every few days for weeks.
    care_highlights:
      - Full sun, consistent moisture, heavy feeder.
      - Trellis vertically — saves space and keeps fruit straight and clean.
      - Inconsistent water produces bitter cucumbers.
      - Pick frequently; leaving one fruit to mature signals the plant to stop producing.
    pest_disease:
      - Cucumber beetles (striped yellow-and-black) — they vector bacterial wilt, which is lethal. Row cover until flowering, then remove.
      - Powdery mildew (very common in humid Mid-Atlantic late summer).
      - Squash vine borer occasionally.
    tidbit: >-
      A cucumber fruit is botanically a "pepo" — the same
      berry-with-a-leathery-rind type as melons, pumpkins, and
      watermelons. The cucumber is ~95% water, and ancient Roman
      emperor Tiberius reportedly insisted on eating them every
      day of the year, which drove the greenhouse innovation.
