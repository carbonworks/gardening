# Registry of generated docs.
#
# Each entry lists a markdown file under docs/ and the data files it is
# generated from. After modifying any of the listed sources, regenerate
# the corresponding doc and bump its `last_generated` date.
#
# See CLAUDE.md for the full workflow.

generated_docs:
  - path: docs/inventory.md
    description: >-
      Snapshot of everything we have: site, growing area, plants,
      containers, nursery, supplies, base mixes, wishlist.
    sources:
      - data/site.yaml
      - data/layout.yaml
      - data/plants.yaml
      - data/containers.yaml
      - data/nursery.yaml
      - data/wishlist.yaml
      - data/supplies.yaml
      - data/mixes.yaml
    last_generated: 2026-04-17

  - path: docs/soil-recipes.md
    description: >-
      Soil base and per-plant soil recipes with measurements and pH
      targets.
    sources:
      - data/mixes.yaml
      - data/plants.yaml
      - data/supplies.yaml
    last_generated: 2026-04-17

  - path: docs/calendar.md
    description: Month-by-month garden tasks tuned for our site.
    sources:
      - data/site.yaml
      - data/calendar.yaml
    last_generated: 2026-04-17

  - path: docs/planting-strategy.md
    description: >-
      Companion planting principles, physical layout/sun zones, and the
      concrete plan for which plants share pots vs. grow solo, and
      where each pot sits on the deck.
    sources:
      - data/companions.yaml
      - data/layout.yaml
      - data/plants.yaml
      - data/containers.yaml
      - data/nursery.yaml
      - data/supplies.yaml
    last_generated: 2026-04-17

  - path: docs/tasks.md
    description: Open garden tasks and recent completions.
    sources:
      - data/tasks.yaml
    last_generated: 2026-04-17

  - path: docs/journal.md
    description: Dated observations and events.
    sources:
      - data/journal.yaml
    last_generated: 2026-04-17
