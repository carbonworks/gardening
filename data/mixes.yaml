# Premixed soil blends kept in stock, and recipes that build on them.
# `supply` references map to `id` values in supplies.yaml.
# Any soil recipe should start from a `premixed-stock` base rather than
# mixing from raw components each time.

mixes:
  - id: base-mushroom-coco-peat
    name: Mushroom / Coco / Peat Base
    status: premixed-stock
    quantity_on_hand: ~10 gal
    components:
      - supply: wild-mushroom-blend
        ratio: 0.5
      - supply: coco-coir
        ratio: 0.25
      - supply: peat-moss
        ratio: 0.25
    usage: Starting base for all soil recipes.
    notes: 50% mushroom compost, 25% coco coir, 25% peat moss.

# Finished soil recipes (built on top of a base mix) can be added below
# as they are defined, e.g.:
#
# recipes:
#   - id: tomato-mix-v1
#     base: base-mushroom-coco-peat
#     additions:
#       - supply: perlite
#         ratio: 0.1
#       - supply: mag-i-cal
#         amount: "1 tbsp per gal"
