# Physical containers and their current or planned plantings.
# `plant` references map to `id` values in plants.yaml.
# `soil_recipe` references map to `id` values in mixes.yaml.
# `status` is one of: proposed, empty, planted, harvested.
# `location` references zones/fixtures described in layout.yaml.

containers:
  - id: container-01
    size: 5 gal
    material: plastic
    status: planted
    planted_on: 2026-04-13
    location: sse-rail / planter-stand-1 (full sun, assumed)
    soil_recipe: tomato-pepper-mix  # retroactively matched; actual mix at planting not recorded
    base:
      material: expanded clay pebbles
      reservoir_depth: 0.5 in
      purpose: catch excess water at the bottom
    plantings:
      - plant: tomato-dora-red
        quantity: 1
      - plant: tomato-joy-red
        quantity: 1
      - plant: marigold
        quantity: 2
        form: seedling-or-plant  # clarify when known
      - plant: nasturtium
        quantity: 2
        form: seed
    notes: Two determinate bush tomatoes co-planted with companion flowers.

  - id: container-02
